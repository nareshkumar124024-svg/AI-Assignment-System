<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Assignment</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="assignment-page">

    <!-- Header -->
    <div class="assignment-header">

        <div>
            <h1>Create New Assignment</h1>
            <p>Create an assignment for your students</p>
        </div>

        <a href="/teacher/dashboard" class="back-btn">
            ← Dashboard
        </a>

    </div>


    <!-- Assignment Form -->
    <div class="assignment-card">

        <div class="form-title">
            <div class="form-icon">📝</div>

            <div>
                <h2>Assignment Details</h2>
                <p>Enter the details of your assignment below.</p>
            </div>
        </div>


        <form method="POST">

            <!-- Subject -->
            <div class="form-group">

                <label for="subject">
                    Subject
                </label>

                <input
                    type="text"
                    id="subject"
                    name="subject"
                    placeholder="e.g. Artificial Intelligence"
                    required>

            </div>


            <!-- Topic -->
            <div class="form-group">

                <label for="topic">
                    Topic
                </label>

                <input
                    type="text"
                    id="topic"
                    name="topic"
                    placeholder="e.g. Machine Learning"
                    required>

            </div>


            <!-- Two Column -->
            <div class="form-row">

                <!-- Questions -->
                <div class="form-group">

                    <label for="total_questions">
                        Total Questions
                    </label>

                    <input
                        type="number"
                        id="total_questions"
                        name="total_questions"
                        placeholder="10"
                        min="1"
                        required>

                </div>


                <!-- Marks -->
                <div class="form-group">

                    <label for="total_marks">
                        Total Marks
                    </label>

                    <input
                        type="number"
                        id="total_marks"
                        name="total_marks"
                        placeholder="20"
                        min="1"
                        required>

                </div>

            </div>


            <!-- Two Column -->
            <div class="form-row">

                <!-- Difficulty -->
                <div class="form-group">

                    <label for="difficulty">
                        Difficulty Level
                    </label>

                    <select
                        id="difficulty"
                        name="difficulty"
                        required>

                        <option value="">
                            Select Difficulty
                        </option>

                        <option value="Easy">
                            Easy
                        </option>

                        <option value="Medium">
                            Medium
                        </option>

                        <option value="Hard">
                            Hard
                        </option>

                    </select>

                </div>


                <!-- Deadline -->
                <div class="form-group">

                    <label for="deadline">
                        Submission Deadline
                    </label>

                    <input
                        type="date"
                        id="deadline"
                        name="deadline"
                        required>

                </div>

            </div>


            <!-- AI Info -->
            <div class="ai-info">

                <div class="ai-info-icon">
                    🤖
                </div>

                <div>
                    <strong>AI Question Generation</strong>

                    <p>
                        After creating the assignment, you can
                        generate questions automatically using AI.
                    </p>
                </div>

            </div>


            <!-- Buttons -->
            <div class="form-buttons">

                <a href="/teacher/dashboard"
                   class="cancel-btn">
                    Cancel
                </a>

                <button type="submit"
                        class="create-btn">
                    Create Assignment
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
